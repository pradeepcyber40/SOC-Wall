# =============================================================================
# Rasi NovaTech SOC Platform - Production Nginx Load Balancer Configuration
# Architecture: High-Availability Reverse Proxy for FastAPI Instances & WebSockets
# =============================================================================

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip compression for low-bandwidth discovery and inventory payloads
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

    # Rate limiting zone to protect API from aggressive scan probes
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # Upstream pool of FastAPI backend instances (Zero-Downtime Deployment)
    upstream soc_backend_cluster {
        # Least connection load balancing
        least_conn;

        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8003 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8000 backup;

        keepalive 32;
    }

    # Upstream frontend UI
    upstream soc_frontend_cluster {
        server 127.0.0.1:5173;
    }

    server {
        listen 80;
        server_name soc.rasinovatech.local localhost;

        # Redirect plain HTTP to HTTPS in production
        # return 301 https://$host$request_uri;

        # Client Max Body Size for batch discovery uploads
        client_max_body_size 25M;

        # 1. API Endpoints Reverse Proxy
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://soc_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Health check failover
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # 2. Real-Time WebSocket Telemetry Gateway
        location /ws/ {
            proxy_pass http://soc_backend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 3. Health & Readiness Probes
        location /health {
            proxy_pass http://soc_backend_cluster/health;
            access_log off;
        }

        location /ready {
            proxy_pass http://soc_backend_cluster/ready;
            access_log off;
        }

        # 4. Frontend Web Dashboard
        location / {
            proxy_pass http://soc_frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
